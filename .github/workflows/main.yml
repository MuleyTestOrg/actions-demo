name: Call a reusable workflow

on:
  push:
    branches: 
      - release/R*/xx-dev  
jobs:
  call-workflow-passing-data:
    uses: narendar-gaddam_sfemu/dch-cicd-templates/.github/workflows/dev_it_template.yml@dev
    with:
#      branch_reference: ${{ github.ref_name }}
#      repo_name: ${{ github.repository }}
#      ENV_NAME: ${{ github.ref_name }}
       REPLICA_SIZE_MAP: "0.2"
       REPLICA_COUNT_MAP: "2"
      # DEPLOYMENT_TARGET_MAP: ${{ vars.DEPLOYMENT_TARGET_MAP }}
      # AWS_ROLE_ARN_MAP: ${{ vars.AWS_ROLE_ARN_MAP }}
      # SPLUNK_INDEX_MAP: ${{ vars.SPLUNK_INDEX_MAP }}
       CLUSTER_MODE_MAP: "false"
      # ANYPOINT_FWD_SSL_SESSION: ${{ vars.ANYPOINT_FWD_SSL_SESSION }}
      # ANYPOINT_LAST_MILE_SECURITY: ${{ vars.ANYPOINT_LAST_MILE_SECURITY }}
      # SPLUNK_TOKEN_MAP: ${{ vars.SPLUNK_TOKEN_MAP }}
      # ANYPOINT_ENV_MAP: ${{ vars.ANYPOINT_ENV_MAP }}
    secrets:
      ANYPOINT_MULE_KEY_MAP: ${{ secrets.ANYPOINT_MULE_KEY_MAP }}
      ANYPOINT_PLATFORM_CLIENT_ID_MAP: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID_MAP }}
      CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }} 
      CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}
